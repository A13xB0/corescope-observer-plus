[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-corescope-observer-plus-plugin"
version = "0.10.0"
description = "openHop plugin: community repeater polling for CoreScope, shared between observers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "openhop_core>=1.1.3,<2",
  "paho-mqtt>=2.1,<3",
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
openhop-corescope-observer-plus = "openhop_corescope_observer_plus.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.corescope_observer_plus" = [
  "openhop-plugin.json",
  "config.default.json",
]
"share/openhop/plugins/openhop.corescope_observer_plus/ui" = [
  "ui/index.html",
  "ui/app.js",
  "ui/styles.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
