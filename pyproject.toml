[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-corescope-observer-plus-plugin"
version = "0.10.1"
description = "openHop plugin: community repeater polling for CoreScope, shared between observers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "openhop_core>=1.1.3,<2",
  "paho-mqtt>=2.1,<3",
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
openhop-corescope-observer-plus = "openhop_corescope_observer_plus.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.corescope_observer_plus" = [
  "openhop-plugin.json",
  "config.default.json",
]
"share/openhop/plugins/openhop.corescope_observer_plus/ui" = [
  "ui/index.html",
  "ui/app.js",
  "ui/styles.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE", "B", "E402", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["openhop_core", "openhop_core.*"]
ignore_missing_imports = true
